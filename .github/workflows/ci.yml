name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install flake8
          pip install -r game-api/requirements.txt

      - name: Lint with flake8
        run: |
          flake8 game-api/app --max-line-length=120 --ignore=E501,E302,W292,E122

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install pytest
          pip install -r game-api/requirements.txt

      - name: Run tests
        run: |
          cd game-api
          pytest tests/ -v || true

  sonarcloud:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0   # SonarCloud needs full history for accurate blame/new-code analysis

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-and-push:
    runs-on: ubuntu-latest
    needs: sonarcloud
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push game-api
        uses: docker/build-push-action@v5
        with:
          context: ./game-api
          push: true
          tags: ghcr.io/lavivasudevan/mindsprint-game-api:latest

      - name: Build and push analytics-api
        uses: docker/build-push-action@v5
        with:
          context: ./analytics-api
          push: true
          tags: ghcr.io/lavivasudevan/mindsprint-analytics-api:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/lavivasudevan/mindsprint-frontend:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy to Oracle VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            sudo kubectl rollout restart deployment/game-api -n mindsprint
            sudo kubectl rollout restart deployment/analytics-api -n mindsprint
            sudo kubectl rollout restart deployment/frontend -n mindsprint
            sudo kubectl rollout restart deployment/redis -n mindsprint