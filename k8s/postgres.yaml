apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: mindsprint
spec:
  serviceName: postgres-service
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: mindsprint
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mindsprint-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: mindsprint
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432