apiVersion: v1
kind: Secret
metadata:
  name: mindsprint-secrets
  namespace: mindsprint
type: Opaque
stringData:
  DATABASE_URL: postgresql://postgres:postgres@postgres-service:5432/mindsprint
  REDIS_URL: redis://redis-service:6379
  ANALYTICS_URL: http://analytics-api-service:8001
  POSTGRES_PASSWORD: postgres