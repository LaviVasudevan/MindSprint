services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mindsprint
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

  game-api:
    build: ./game-api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/mindsprint
      REDIS_URL: redis://redis:6379
      ANALYTICS_URL: http://analytics-api:8001
    depends_on:
      - postgres
      - redis

  analytics-api:
    build: ./analytics-api
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - game-api
      - analytics-api

volumes:
  postgres_data: